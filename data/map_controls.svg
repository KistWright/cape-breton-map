<svg xmlns="http://www.w3.org/2000/svg" width="300" height="246" viewBox="0 0 300 246" fill="none">
  <!-- Panel -->
  <rect x="10" y="10" width="280" height="226" rx="12" fill="#ffffff" stroke="#d9dee3" stroke-width="2"/>
  <rect x="10" y="10" width="280" height="32" rx="12" fill="#f8fafb"/>
  <line x1="10" y1="42" x2="290" y2="42" stroke="#e7ebef" stroke-width="2"/>

  <!-- Header -->
  <text x="22" y="31" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#192930">Map controls</text>
  <text x="271" y="31" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#192930">×</text>

  <!-- Row dividers -->
  <line x1="18" y1="108" x2="282" y2="108" stroke="#eef2f4" stroke-width="2"/>
  <line x1="18" y1="174" x2="282" y2="174" stroke="#eef2f4" stroke-width="2"/>

  <!-- ==================== ROW 1 ==================== -->
  <g transform="translate(12,49) scale(0.50)" stroke="#192930" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="18" y="18" width="44" height="68" rx="22"/>
    <line x1="40" y1="18" x2="40" y2="38"/>
    <path d="M40 18 C28 18 18 28 18 40 L40 40 Z" fill="#192930" stroke="none"/>

    <line x1="78" y1="52" x2="122" y2="52"/>
    <polyline points="86,44 78,52 86,60"/>
    <polyline points="114,44 122,52 114,60"/>

    <line x1="100" y1="29" x2="100" y2="75"/>
    <polyline points="92,37 100,29 108,37"/>
    <polyline points="92,67 100,75 108,67"/>

    <g transform="translate(-3,3)">
      <rect x="152" y="28" width="42" height="42" rx="4"/>
      <line x1="166" y1="28" x2="166" y2="70"/>
      <line x1="180" y1="28" x2="180" y2="70"/>
      <line x1="152" y1="42" x2="194" y2="42"/>
      <line x1="152" y1="56" x2="194" y2="56"/>
      <polyline points="169,18 173,14 177,18"/>
      <polyline points="169,80 173,84 177,80"/>
      <polyline points="142,45 138,49 142,53"/>
      <polyline points="204,45 208,49 204,53"/>
    </g>
  </g>

  <text x="136" y="69" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#192930">Drag</text>
  <text x="136" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425563">Left button + move</text>

  <!-- ==================== ROW 2 ==================== -->
  <g transform="translate(12,115) scale(0.50)" stroke="#192930" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="18" y="18" width="44" height="68" rx="22"/>
    <line x1="40" y1="18" x2="40" y2="38"/>
    <path d="M40 18 C52 18 62 28 62 40 L40 40 Z" fill="#192930" stroke="none"/>

    <line x1="82" y1="52" x2="120" y2="52"/>
    <polyline points="90,44 82,52 90,60"/>
    <polyline points="112,44 120,52 112,60"/>

    <g transform="translate(-3,3)">
      <rect x="144" y="28" width="42" height="42" rx="4"/>
      <line x1="158" y1="28" x2="158" y2="70"/>
      <line x1="172" y1="28" x2="172" y2="70"/>
      <line x1="144" y1="42" x2="186" y2="42"/>
      <line x1="144" y1="56" x2="186" y2="56"/>
      <circle cx="165" cy="49" r="3" fill="#192930" stroke="none"/>
      <path d="M185 18 A12 12 0 0 1 200 33"/>
      <polyline points="196,27 200,33 204,27"/>
      <path d="M149 84 A12 12 0 0 1 134 69"/>
      <polyline points="130,75 134,69 138,75"/>
    </g>
  </g>

  <text x="136" y="135" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#192930">Rotate</text>
  <text x="136" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425563">Right button + left/right</text>

  <!-- ==================== ROW 3 ==================== -->
  <g transform="translate(12,178) scale(0.50)" stroke="#192930" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mouse -->
    <rect x="18" y="18" width="44" height="68" rx="22"/>
    <line x1="40" y1="18" x2="40" y2="38"/>
    <path d="M40 18 C52 18 62 28 62 40 L40 40 Z" fill="#192930" stroke="none"/>

    <!-- Middle icon moved further right for spacing from mouse -->
    <line x1="98" y1="32" x2="98" y2="72"/>
    <polyline points="90,40 98,32 106,40"/>
    <polyline points="90,64 98,72 106,64"/>

    <!-- Right-hand result icon nudged a bit right -->
    <g transform="translate(1,6)">
      <rect x="132" y="24" width="42" height="42" rx="4"/>
      <line x1="146" y1="24" x2="146" y2="66"/>
      <line x1="160" y1="24" x2="160" y2="66"/>
      <line x1="132" y1="38" x2="174" y2="38"/>
      <line x1="132" y1="52" x2="174" y2="52"/>
      <g transform="rotate(15 188 32)">
        <path d="M178 26 C187 26 194 31 198 38"/>
        <polyline points="196.7,27.8 198,38 189.0,35.5"/>
      </g>
      <g stroke-dasharray="2 6">
        <polygon points="132,66 174,66 186,45 148,45"/>
      </g>
    </g>
  </g>

  <text x="136" y="201" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#192930">Tilt</text>
  <text x="136" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425563">Right button + up/down</text>
</svg>